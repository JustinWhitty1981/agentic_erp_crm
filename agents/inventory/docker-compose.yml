# The inventory agent, on this server. Same lineage as agents/customer_service/docker-compose.yml
# - same machine facts, read the same way, for the reasons stated there and repeated only where
# they change meaning here.
#
#   * AFPC_PG_HOST is an IP address, not `afpc-pg`: the leaf certificate carries IP SANs only, and
#     sslmode=verify-full validates against those. scripts/db/init.sh is the only thing that can
#     know which address the certificate named, and it now writes that machine fact to every
#     agent directory's own .env - including this one. It is NOT read across directories from
#     agents/customer_service/: Compose interpolates ${...} only from the project .env and the
#     shell, never from env_file entries (the customer service file's header records learning
#     that the hard way), so a shared file would update one agent on re-provision and silently
#     leave the other pointing at an address the new certificate no longer lists.
#   * The CA is bind-mounted read-only from dev/tls/, never baked into the image, for the same
#     re-export reason.
#
# The port is 4560: the reference drop holds 4545 and the customer service agent holds 4550, and
# an agent's port is the one part of its identity an operator has to type.

services:
  inventory-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afpc-inventory-agent
    ports:
      - "4560:8000"
    env_file:
      # The database credentials, as with the customer service agent: dev/.env is the source of
      # truth and scripts/db/roles.sql sets the role passwords from it. AFPC_PG_HOST for the
      # interpolation below comes from the .env init.sh wrote beside this file, not from here.
      - ../../dev/.env
    environment:
      # --- which model to talk to ---------------------------------------------
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://192.168.0.42:18300/v1}
      - VLLM_MODEL=${VLLM_MODEL:-qwen3.8-flash-next}
      - LLM_STREAM=${LLM_STREAM:-true}

      # --- who this process is, in the trail ---------------------------------
      # This value is agent_interactions.bot_id on every row this process writes, conversational
      # and scheduled alike - the field that separates this agent's trajectory from the customer
      # service agent's when both run against one database, which is the case here.
      - AGENT_ROLE=inventory

      # --- which tenant this process answers as ------------------------------
      - AFPC_TENANT_ID=${AFPC_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      - AFPC_PG_HOST=${AFPC_PG_HOST:?set it to an address in the leaf certificate's SAN list, or run scripts/db/init.sh on this machine, which writes this file's sibling with the one it just put in the certificate}
      - AFPC_PG_PORT=${AFPC_PG_PORT:-5432}
      - AFPC_PG_DB=${AFPC_PG_DB:-agent_first_erp_crm}
      - AFPC_PG_USER=${AFPC_PG_USER:-afpc_app}
      - AFPC_PG_SSLMODE=${AFPC_PG_SSLMODE:-verify-full}
      - AFPC_PG_SSLROOTCERT=/etc/ssl/certs/afpc-ca.crt
      - AFPC_PG_APPNAME=${AFPC_PG_APPNAME:-inventory-agent}

      # --- the schedule ------------------------------------------------------
      # Minutes between deterministic stock checks; the first tick is 30s after start. This is
      # the in-container timer the requirements doc's cron requirement became: one process, one
      # restart, one liveness, and the checklist of "did every 30 minutes run" is
      # agent_interactions, not a cron log.
      - INVENTORY_CHECK_INTERVAL_MINUTES=${INVENTORY_CHECK_INTERVAL_MINUTES:-30}

      # --- how loud and how careful ------------------------------------------
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - LOG_AGENT_INTERACTIONS=${LOG_AGENT_INTERACTIONS:-true}
      - STRICT_TOOL_POLICIES=${STRICT_TOOL_POLICIES:-true}
      - REQUIRE_WRITE_APPROVAL=${REQUIRE_WRITE_APPROVAL:-false}
      - MAX_TOOL_ITERATIONS=${MAX_TOOL_ITERATIONS:-10}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-1048576}

      # --- who this endpoint answers -----------------------------------------
      - API_KEYS=${API_KEYS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4560,http://127.0.0.1:4560}

      # --- runtime plumbing -------------------------------------------------
      - HOST=0.0.0.0
      - PORT=8000
      - TZ=${TZ:-America/Chicago}
      # db is not optional here the way it is for the customer service agent: the alert memory
      # the timer writes is only worth writing if it survives the container.
      - MEMORY_DRIVER=db

    volumes:
      - ../../dev/tls/afpc-ca.crt:/etc/ssl/certs/afpc-ca.crt:ro

    restart: unless-stopped
    healthcheck:
      # Same contract as the customer service agent's: 503 when the database is configured and
      # not answering. A degraded container here means the timer is not running either, which is
      # exactly the state a monitor should catch.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
