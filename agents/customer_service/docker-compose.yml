# The customer service agent, on this server.
#
# Two things about this file are consequences of how the machine is configured rather than choices
# made here, and both are in dev/README:
#
#   * AFPC_PG_HOST is an IP address, not `afpc-pg`. The database's leaf certificate carries IP
#     subjectAltNames only, so sslmode=verify-full validates against the IP addresses it lists and fails
#     against
#     every DNS name that reaches the same server - including the container name and
#     host.docker.internal. The container is on the LAN like everything else on this box, so it can
#     route to that address directly.
#   * The CA is bind-mounted read-only rather than baked into the image. It is a secret-adjacent file,
#     and scripts/db/init.sh re-exports it from the container every time it provisions, so an image
#     carrying its own copy would keep validating a CA that no longer exists.
#
# There is no memory_store volume, and that is the point: 0023 moved what the agent remembers into
# agent_memories, so a bind mount would be a second, divergent copy of a thing that now has one home.

# No `version:` key. It is obsolete in Compose v2 and every file here predates that, so it is a line
# that prints a warning on every `up` while doing nothing - and `agents/customer_service` carried it
# until this deployment was actually started rather than reviewed.

services:
  customer-service-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afpc-customer-service
    ports:
      # The reference drop published 4545; this deployment uses 4550 so both can run at once while
      # the new one is being smoke-tested against the old one's traffic.
      - "4550:8000"
    env_file:
      # The database credentials live in dev/.env and are not duplicated here. That file is
      # gitignored, and it is the source of truth: scripts/db/roles.sql sets the role passwords from
      # it, so a password written in two places can only be wrong in one of them.
      #
      # ../../ and not ../: paths in a compose file resolve against *this file's* directory, which is
      # agents/customer_service, one level deeper than the dev/ directory this line was written for.
      # The wrong depth fails with "env file ... not found" before the container is even created, and
      # only when the stack is actually started - a review of this file could not have caught it.
      - ../../dev/.env
    environment:
      # --- which model to talk to ---------------------------------------------
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://192.168.0.42:18300/v1}
      - VLLM_MODEL=${VLLM_MODEL:-qwen3.8-flash-next}
      - LLM_STREAM=${LLM_STREAM:-true}

      # --- the embedder, and the keeper that calls it ------------------------
      # Semantic search is off unless EMBEDDING_MODEL is set, and it is set here rather than in
      # dev/.env because it is a decision about what this agent does rather than a credential.
      # The interpolation is from the PROJECT .env (agents/customer_service/.env), which is the file
      # scripts/db/init.sh owns and the only one compose expands ${...} from - the same rule that
      # makes AFPC_PG_HOST work below, and the reason the key is NOT translated here: a line like
      # `VLLM_API_KEY=${LITELLM_API_KEY}` expands to nothing when the value lives in an env_file,
      # so the process reads LITELLM_API_KEY itself, from dev/.env, by name. pkg/embed's
      # EnvServerKey comment is the record of that.
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-8}
      - EMBEDDING_ROWS_PER_TICK=${EMBEDDING_ROWS_PER_TICK:-500}
      - EMBEDDING_INTERVAL_MINUTES=${EMBEDDING_INTERVAL_MINUTES:-60}

      # --- which tenant this process answers as ------------------------------
      # Resolved once at startup and set on every pooled connection. It is not a request parameter
      # because a per-request tenant with a single pooled identity is exactly the masquerading shape
      # dev/README warns about: the connection would carry whoever claimed it last.
      - AFPC_TENANT_ID=${AFPC_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      # Required, with no default on purpose. The value has to be an address the leaf certificate
      # lists in its subjectAltNames, which is a fact about whichever machine provisioned it - so a
      # fallback baked into a file that gets cloned would be an address that is wrong for everyone else
      # and, worse, would send a stranger's client to somebody's LAN. scripts/db/init.sh writes this
      # file's sibling, agents/customer_service/.env, with the address it just put in the certificate,
      # which is the only place that can know it. Compose's :? form fails at parse time and prints the
      # message, so an unconfigured clone stops rather than starting degraded for a reason nobody sees.
      #
      # The message names the leaf, not the CA, because that is where the SANs are: dev/tls/afpc-ca.crt
      # carries no subjectAltName at all (measured), so pointing a stuck reader at it would send them to
      # a file that does not contain the answer they came for.
      - AFPC_PG_HOST=${AFPC_PG_HOST:?set it to an address in the leaf certificate's SAN list (docker exec afpc-pg openssl x509 -in /certs/server.crt -noout -ext subjectAltName), or run scripts/db/init.sh on this machine}
      - AFPC_PG_PORT=${AFPC_PG_PORT:-5432}
      - AFPC_PG_DB=${AFPC_PG_DB:-agent_first_erp_crm}
      - AFPC_PG_USER=${AFPC_PG_USER:-afpc_app}
      # The password arrives from env_file above, under the name dev/.env and scripts/db/roles.sql use:
      # AFPC_APP_PASSWORD, the afpc_app role's password. The server reads that name as well as
      # AFPC_PG_PASSWORD - pkg/db's resolvePassword explains the order - and nothing translates it here,
      # because `- AFPC_PG_PASSWORD=${AFPC_APP_PASSWORD}`, the obvious way to write the translation,
      # silently does nothing: Compose interpolates ${...} from its own process environment and the
      # project's .env, *not* from a file named under env_file:. The expansion is empty, the agent
      # starts without a database, and the secret sits one line away under the other name. That is why
      # this deployment went degraded on its first real `up`, and why the answer is a resolution rule in
      # the one place that can see both variables at runtime.
      #
      # AFPC_PG_PASSWORD is the name to set when this file is not the one supplying the credential.
      - AFPC_PG_SSLMODE=${AFPC_PG_SSLMODE:-verify-full}
      - AFPC_PG_SSLROOTCERT=/etc/ssl/certs/afpc-ca.crt
      - AFPC_PG_APPNAME=${AFPC_PG_APPNAME:-customer-service-agent}

      # --- who this process is, in the trail ---------------------------------
      # communications.agent_id and agent_interactions.bot_id both take this value, and neither takes
      # it from a tool argument.
      - AGENT_ROLE=${AGENT_ROLE:-customer_service}

      # --- how loud and how careful ------------------------------------------
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - LOG_AGENT_INTERACTIONS=${LOG_AGENT_INTERACTIONS:-true}
      - STRICT_TOOL_POLICIES=${STRICT_TOOL_POLICIES:-true}
      - REQUIRE_WRITE_APPROVAL=${REQUIRE_WRITE_APPROVAL:-false}
      - MAX_TOOL_ITERATIONS=${MAX_TOOL_ITERATIONS:-10}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-1048576}

      # --- how the endpoint is guarded ---------------------------------------
      # Empty means open, which the health endpoint reports as "DISABLED" and the startup line warns
      # about. The reference token is named here so a reader finds it in the place the code looks.
      - API_KEYS=${API_KEYS:-}
      # Loopback only as the default. The UI is served by this same process, so opening it from the
      # machine it runs on needs no origin at all; the list matters only for a browser on another box,
      # and that is a decision the operator makes rather than one a cloned file can guess.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4550,http://127.0.0.1:4550}

      # --- runtime plumbing -------------------------------------------------
      - HOST=0.0.0.0
      - PORT=8000
      - TZ=${TZ:-America/Chicago}
      # The memory store's driver is a deployment decision, not a code one. `db` is the only value
      # that survives a rebuild; `file` is kept for a machine with no database.
      - MEMORY_DRIVER=${MEMORY_DRIVER:-db}
      - MEMORY_DIR=${MEMORY_DIR:-/tmp/memory_store}

      # --- optional, and inert when unset -----------------------------------
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ALLOW_INTERNAL_SCRAPE=${ALLOW_INTERNAL_SCRAPE:-false}

    volumes:
      # Same depth correction as env_file above. Getting this one wrong is worse than the other:
      # Docker creates a missing bind source as an empty *directory*, so the mount succeeds and the
      # agent fails at connect with "certificate signed by unknown authority" - a path that reads as a
      # certificate problem and is really a typo.
      - ../../dev/tls/afpc-ca.crt:/etc/ssl/certs/afpc-ca.crt:ro

    extra_hosts:
      # Not used for the database, for the certificate reason above. It is here because the model
      # server is on another machine and a future setup with it on this one would otherwise need a
      # compose change to reach it by name.
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    healthcheck:
      # /api/health answers 503 rather than 200 when the database is configured and not answering, so
      # a monitor can page on the difference between "the container is up" and "the agent can work".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
