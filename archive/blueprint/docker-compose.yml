version: '3.8'

services:
  customer-service-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs-bot
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://{your-ollama-host}:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ornith:35b}
      - POSTGRES_HOST=${POSTGRES_HOST:-{your-postgres-host}}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-agent_first_erp_crm}
      - POSTGRES_USER=${POSTGRES_USER:-agent_first_erp_crm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-{yourpasswordhere}}
    restart: unless-stopped
    networks:
      - agent-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  agent-network:
    driver: bridge
